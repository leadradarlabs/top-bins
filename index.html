<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Deep Cuts — The EPL Rare-Answer Game</title>
  <meta name="description" content="Name the obscure one. A daily Premier League trivia game where rarity is the score." />
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="brand">
        <h1>DEEP <span>CUTS</span></h1>
        <p>The EPL rare-answer game. Name the obscure one.</p>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="val" id="stat-streak">0</div>
          <div class="lbl">Streak</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-best">0</div>
          <div class="lbl">Best score</div>
        </div>
      </div>

      <button class="btn-primary btn-play" id="btn-play">Play today's Deep Cuts</button>

      <footer class="site-footer">7 prompts. 25 seconds each. Perfect day = 700.</footer>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <div class="game-header">
        <span id="game-mode-label">Deep Cuts</span>
        <div class="progress-dots" id="progress-dots"></div>
      </div>

      <div class="timer-ring" id="timer-ring">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle class="track" cx="46" cy="46" r="40"></circle>
          <circle class="progress" id="timer-circle" cx="46" cy="46" r="40"></circle>
        </svg>
        <div class="time" id="timer-seconds">25</div>
      </div>

      <div class="prompt-text" id="prompt-text">Loading…</div>

      <form class="guess-form" id="guess-form" autocomplete="off">
        <div class="guess-input-wrap">
          <input class="guess-input" id="guess-input" type="text" placeholder="Last name…" autocomplete="off" autocapitalize="words" />
          <div class="autocomplete-list" id="autocomplete-list"></div>
        </div>
        <button class="guess-submit" type="submit">Go</button>
      </form>
      <div class="feedback" id="feedback"></div>

      <div class="running-score">
        Score: <strong id="running-score">0</strong> / <span id="running-max">700</span>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen">
      <div class="brand" style="padding-top:8px;">
        <h1 style="font-size:1.8rem;">Full <span>Time</span></h1>
      </div>
      <div class="results-score">
        <div class="big" id="final-score">0</div>
        <div class="max">out of <span id="final-max">700</span></div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="val" id="results-streak">0</div>
          <div class="lbl">Streak</div>
        </div>
        <div class="stat-box">
          <div class="val" id="results-best">0</div>
          <div class="lbl">Best score</div>
        </div>
      </div>
      <div class="tier-breakdown" id="tier-breakdown"></div>
      <div class="results-actions">
        <button class="btn-primary" id="btn-share">Copy share card</button>
        <button class="btn-secondary" data-back="home">Back to home</button>
      </div>
    </section>

    <!-- TIER REVEAL OVERLAY -->
    <div class="tier-reveal" id="tier-reveal">
      <div class="tier-name" id="reveal-name"></div>
      <div class="tier-points" id="reveal-points"></div>
      <div class="rarity-bar" id="rarity-bar">
        <div class="rarity-fill" id="rarity-fill"></div>
        <div class="rarity-marker" id="rarity-marker"></div>
      </div>
      <div class="rarity-labels"><span>Tap-In</span><span>Top Bins</span></div>
      <div class="tier-answer" id="reveal-answer"></div>
    </div>

  </div>

  <script src="js/seed.js"></script>
  <script src="js/fuzzy.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/share.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
